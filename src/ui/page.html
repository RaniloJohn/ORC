<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>orc</title>
<style>
  :root {
    --bg: #faf9f6; --side: #f3f1ec; --panel: #ffffff; --sunk: #efede7; --bubble: #ecebe6;
    --text: #1d1c1a; --muted: #6b6860; --border: #e2dfd7; --accent: #c96442; --accent-text: #ffffff;
    --link: #2f5fd0; --ok: #1f7a4a; --ok-bg: #e2f3ea; --bad: #b3372b; --bad-bg: #fbe6e3;
    --warn: #8a5a00; --warn-bg: #fbf0d6; --info: #2f5fd0; --info-bg: #e6edfb;
    --c-claude: #c96442; --c-argon: #2f7ae0; --c-hydro: #1aa37a;
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #262624; --side: #1f1e1d; --panel: #30302e; --sunk: #1f1e1d; --bubble: #141413;
      --text: #ecebe6; --muted: #a09d94; --border: #3d3c39; --accent: #d97757; --accent-text: #ffffff;
      --link: #8fb0ff; --ok: #6fd3a0; --ok-bg: #173526; --bad: #ff9a8f; --bad-bg: #40201c;
      --warn: #f0c060; --warn-bg: #3a2e12; --info: #8fb0ff; --info-bg: #1c2740;
      --c-claude: #d97757; --c-argon: #5b9cf5; --c-hydro: #3cc497;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 system-ui, "Segoe UI", sans-serif; overflow: hidden; }
  button { font: inherit; color: var(--text); background: none; border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button:hover { background: var(--sunk); }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  button.primary:hover { filter: brightness(1.05); }
  button.danger { color: var(--bad); }
  button.ghost { border-color: transparent; }
  button.small { padding: 3px 9px; font-size: 13px; }
  input, textarea, select { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; width: 100%; }
  textarea { resize: vertical; }
  input:focus, textarea:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 0 0 3px; }
  code, .mono { font-family: var(--mono); font-size: 13px; }
  h1, h2, h3, h4 { margin: 0; font-weight: 600; }

  .app { display: grid; grid-template-columns: 270px minmax(0, 1fr) 320px; height: 100vh; }
  .app.noleft { grid-template-columns: 0 minmax(0, 1fr) 320px; }
  .app.noright { grid-template-columns: 270px minmax(0, 1fr) 0; }
  .app.noleft.noright { grid-template-columns: 0 minmax(0, 1fr) 0; }
  .app > * { min-width: 0; min-height: 0; overflow: hidden; }

  /* ---------- left: projects ---------- */
  .left { background: var(--side); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
  .left .top { padding: 12px 10px 6px; display: flex; flex-direction: column; gap: 2px; }
  .brand { display: flex; align-items: center; justify-content: space-between; padding: 2px 8px 10px; }
  .brand strong { font-size: 18px; letter-spacing: -.02em; }
  .navbtn { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; padding: 7px 8px; border-radius: 8px; }
  .navbtn .ic { width: 18px; text-align: center; color: var(--muted); }
  .search { margin: 4px 0 2px; }
  .search input { background: var(--panel); padding: 6px 10px; font-size: 14px; }
  .projects { flex: 1; overflow-y: auto; padding: 6px 10px 16px; }
  .proj { margin-top: 12px; }
  .proj-h { display: flex; align-items: center; gap: 6px; width: 100%; border: 0; padding: 4px 8px; font-size: 12px; font-weight: 600; color: var(--muted); text-align: left; border-radius: 6px; }
  .proj-h.cur { color: var(--text); }
  .proj-h .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .runbtn { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; text-align: left; padding: 6px 8px; border-radius: 8px; font-size: 14px; }
  .runbtn .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .runbtn.sel { background: var(--panel); box-shadow: 0 0 0 1px var(--border); }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--muted); opacity: .5; }
  .dot.live { background: var(--info); opacity: 1; animation: pulse 1.4s ease-in-out infinite; }
  .dot.ok { background: var(--ok); opacity: 1; } .dot.bad { background: var(--bad); opacity: 1; } .dot.warn { background: var(--warn); opacity: 1; }
  @keyframes pulse { 50% { opacity: .35; } }
  .empty { color: var(--muted); font-size: 13px; padding: 4px 8px; }

  /* ---------- center: conversation ---------- */
  .center { display: flex; flex-direction: column; background: var(--bg); }
  .bar { display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-bottom: 1px solid var(--border); min-height: 48px; }
  .bar .title { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .feed { flex: 1; overflow-y: auto; }
  .col { max-width: 780px; margin: 0 auto; padding: 24px 22px 30px; }
  .msg { margin: 0 0 22px; }
  .user { display: flex; justify-content: flex-end; }
  .user .b { background: var(--bubble); border-radius: 14px; padding: 10px 14px; max-width: 85%; white-space: pre-wrap; overflow-wrap: anywhere; }
  .user .files { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .who { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .av { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; color: #fff; font-size: 12px; font-weight: 700; flex: none; }
  .av.claude { background: var(--c-claude); } .av.argon { background: var(--c-argon); } .av.hydro { background: var(--c-hydro); } .av.orc { background: var(--muted); }
  .ai p { margin: 0 0 8px; }
  .ai ol, .ai ul { margin: 4px 0 10px; padding-left: 22px; }
  .ai li { margin: 3px 0; }
  .task { border: 1px solid var(--border); border-radius: 12px; background: var(--panel); padding: 14px 16px; }
  .task-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 8px; }
  .task-h h3 { font-size: 15px; }
  .att { border-top: 1px solid var(--border); margin-top: 12px; padding-top: 10px; }
  .att h4 { font-size: 13px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
  .kv { margin: 4px 0; font-size: 14px; }
  .chip { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
  .chip.ok { background: var(--ok-bg); color: var(--ok); } .chip.bad { background: var(--bad-bg); color: var(--bad); }
  .chip.warn { background: var(--warn-bg); color: var(--warn); } .chip.live { background: var(--info-bg); color: var(--info); }
  details { margin-top: 6px; }
  summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  summary:hover { color: var(--text); }
  details > div { margin-top: 6px; }
  .lines { list-style: none; margin: 0; padding: 0; font-size: 12.5px; color: var(--muted); font-family: var(--mono); }
  .lines li { padding: 1px 0; overflow-wrap: anywhere; }
  .lines b { font-weight: 600; color: var(--text); font-family: system-ui, sans-serif; }
  .filelist { list-style: none; margin: 4px 0 0; padding: 0; font-family: var(--mono); font-size: 12.5px; }
  .quote { background: var(--sunk); border-radius: 8px; padding: 9px 11px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13.5px; }
  .sys { font-size: 13px; color: var(--muted); text-align: center; margin: 0 0 18px; }
  .banner { border-radius: 12px; padding: 12px 15px; margin: 0 0 18px; font-size: 14px; }
  .banner strong { display: block; }
  .banner.ok { background: var(--ok-bg); } .banner.bad { background: var(--bad-bg); } .banner.warn { background: var(--warn-bg); } .banner.info { background: var(--info-bg); }
  .card { border: 1px solid var(--border); border-radius: 12px; background: var(--panel); padding: 14px 16px; margin: 0 0 18px; }
  .card.ask { border: 2px solid var(--accent); }
  .card ol { padding-left: 20px; margin: 8px 0 0; display: flex; flex-direction: column; gap: 10px; }
  .card ol p { margin: 0 0 5px; }
  .now { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 14px; margin: 0 0 18px; }
  .now .what { flex: 1; min-width: 0; }
  .now .what strong { color: var(--text); font-weight: 500; display: block; }
  .now small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); font-size: 12px; }
  .spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--accent); border-right-color: transparent; animation: spin 1s linear infinite; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner, .dot.live { animation: none; } }
  .hint { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
  .err { color: var(--bad); font-size: 14px; margin: 8px 0 0; }
  .hello { text-align: center; padding: 12vh 0 20px; }
  .hello h1 { font-size: 28px; font-weight: 500; letter-spacing: -.01em; margin-bottom: 8px; }

  .composer-wrap { padding: 0 22px 14px; }
  .composer { max-width: 780px; margin: 0 auto; background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 10px 12px 8px; box-shadow: 0 1px 6px rgba(0,0,0,.06); }
  .composer.dragging { outline: 2px dashed var(--accent); outline-offset: 3px; }
  .composer textarea { border: 0; background: none; padding: 4px 2px; resize: none; min-height: 26px; max-height: 260px; outline: none; }
  .composer .row2 { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .composer .mode { flex: 1; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .iconbtn { width: 32px; height: 32px; padding: 0; display: grid; place-items: center; border-radius: 8px; font-size: 18px; line-height: 1; }
  .send { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips:not(:empty) { margin-bottom: 6px; }
  .chip-file { display: inline-flex; align-items: center; gap: 6px; max-width: 240px; border: 1px solid var(--border); border-radius: 8px; padding: 3px 4px 3px 6px; font-size: 12.5px; background: var(--sunk); }
  .chip-file img { width: 28px; height: 28px; object-fit: cover; border-radius: 4px; flex: none; }
  .chip-file span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip-file button { padding: 0 5px; border: 0; font-size: 15px; line-height: 1; color: var(--muted); }

  /* ---------- right: context and usage ---------- */
  .right { background: var(--side); border-left: 1px solid var(--border); overflow-y: auto; }
  .rsec { padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .rsec h2 { font-size: 13px; font-weight: 600; margin-bottom: 10px; }
  .env { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; margin: 4px 0; overflow-wrap: anywhere; }
  .env .ic { color: var(--muted); width: 16px; flex: none; text-align: center; }
  .meter { margin: 8px 0; font-size: 13px; }
  .meter .top { display: flex; justify-content: space-between; }
  .meter .barx { height: 5px; border-radius: 3px; background: var(--sunk); overflow: hidden; margin-top: 4px; }
  .meter .barx i { display: block; height: 100%; background: var(--accent); }
  .meter.high .barx i { background: var(--bad); }
  .model { margin: 0 0 14px; }
  .model:last-child { margin-bottom: 0; }
  .model-h { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600; }
  .model-h .sub { font-weight: 400; color: var(--muted); font-size: 12px; margin-left: auto; font-family: var(--mono); }
  .seg { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--sunk); margin: 6px 0; }
  .seg i { display: block; height: 100%; }
  table.u { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  table.u td { padding: 2px 0; }
  table.u td + td { text-align: right; color: var(--muted); }
  .sq { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; vertical-align: 0; }
  .opts { display: flex; flex-direction: column; gap: 9px; }
  .opts select, .opts input, .opts textarea { font-size: 13.5px; padding: 5px 8px; }
  .check { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: var(--text); margin: 0; }
  .check input { width: auto; margin-top: 3px; }
  .tasks { list-style: none; margin: 0; padding: 0; font-size: 13px; }
  .tasks li { display: flex; gap: 8px; align-items: center; padding: 3px 0; }
  .tasks .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  dialog { border: 1px solid var(--border); border-radius: 12px; background: var(--panel); color: var(--text); padding: 18px; width: min(560px, 92vw); }
  dialog::backdrop { background: rgba(0, 0, 0, .45); }
  .dirs { list-style: none; margin: 10px 0; padding: 0; max-height: 48vh; overflow: auto; border: 1px solid var(--border); border-radius: 8px; }
  .dirs button { width: 100%; text-align: left; border: 0; border-radius: 0; border-bottom: 1px solid var(--border); }
  .dirs li:last-child button { border-bottom: 0; }
  .path { font-family: var(--mono); font-size: 13px; overflow-wrap: anywhere; }
  .row { display: flex; gap: 8px; align-items: center; }
  .spread { display: flex; justify-content: space-between; align-items: center; gap: 8px; }

  @media (max-width: 1100px) {
    .app, .app.noleft, .app.noright, .app.noleft.noright { grid-template-columns: minmax(0, 1fr); }
    .left, .right { position: fixed; top: 0; bottom: 0; z-index: 20; width: min(300px, 86vw); box-shadow: 0 0 30px rgba(0,0,0,.25); }
    .left { left: 0; } .right { right: 0; }
    .app.noleft .left, .app.noright .right { display: none; }
    .col { padding: 18px 16px 24px; }
    .composer-wrap { padding: 0 12px 12px; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="left">
    <div class="top">
      <div class="brand"><strong>orc</strong><button class="ghost iconbtn" id="hideleft" title="Hide sidebar" aria-label="Hide sidebar">⟨</button></div>
      <button class="navbtn" id="newrun"><span class="ic">＋</span>New run</button>
      <button class="navbtn" id="addproject"><span class="ic">▢</span>Add project folder</button>
      <div class="search"><input id="search" placeholder="Search runs" aria-label="Search runs" spellcheck="false"></div>
    </div>
    <nav class="projects" id="projects"></nav>
  </aside>

  <section class="center">
    <div class="bar">
      <button class="ghost iconbtn" id="showleft" title="Show sidebar" aria-label="Show sidebar">☰</button>
      <div class="title" id="bartitle">New run</div>
      <span id="barchip"></span>
      <span id="barstop"></span>
      <button class="ghost iconbtn" id="toggleright" title="Context and usage" aria-label="Context and usage">◧</button>
    </div>
    <div class="feed" id="feed"><div class="col" id="main"></div></div>
    <div class="composer-wrap">
      <div class="composer" id="composer">
        <div class="chips" id="chips-msg"></div>
        <textarea id="msg" rows="1" placeholder="Describe what you want built"></textarea>
        <div class="row2">
          <label class="iconbtn" title="Attach pictures or files" style="margin:0;cursor:pointer;border:1px solid var(--border);color:var(--text)">＋<input type="file" multiple hidden data-attach="msg"></label>
          <span class="mode" id="mode"></span>
          <span id="extra"></span>
          <button class="iconbtn send" id="send" title="Send" aria-label="Send">↑</button>
        </div>
      </div>
    </div>
  </section>

  <aside class="right" id="right"></aside>
</div>

<dialog id="picker">
  <h3>Choose a project folder</h3>
  <p class="path" id="pickpath"></p>
  <ul class="dirs" id="pickdirs"></ul>
  <div class="spread">
    <button id="pickup" class="small">Up one level</button>
    <div class="row"><button id="pickcancel">Cancel</button><button id="pickuse" class="primary">Use this folder</button></div>
  </div>
</dialog>

<script>
const TOKEN = '__ORC_TOKEN__';
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const k = (n) => (n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1000 ? Math.round(n / 1000) + 'k' : String(n || 0));
const plural = (n, word) => n + ' ' + word + (n === 1 ? '' : 's');
const base = (p) => String(p).replace(/[\\/]+$/, '').split(/[\\/]/).pop() || p;

const ui = {
  folder: '',          // project chosen for a new run
  repo: null,          // resolved root of the open run's project
  projects: [],        // [{ folder, repo, runs }]
  view: { kind: 'new' },
  events: [],
  info: null,
  open: new Set(),
  lastEventAt: Date.now(),
  error: '',
  busy: false,
  search: '',
  files: { msg: [] },
};

function store(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} }
function load(key, fallback) {
  let v = null;
  try { v = localStorage.getItem(key); } catch { return fallback; }
  if (v === null || v === '') return fallback;
  try { return JSON.parse(v); } catch { return v; } // saved by the earlier page as a plain string
}

function setOffline(off) {
  let bar = $('offline');
  if (off && !bar) {
    bar = document.createElement('div');
    bar.id = 'offline';
    bar.className = 'banner bad';
    bar.style.cssText = 'margin:0;border-radius:0;text-align:center;position:fixed;top:0;left:0;right:0;z-index:50';
    bar.innerHTML = '<strong>Lost contact with orc.</strong>Its small black window has to stay open. Start orc-ui.cmd again, then reload this page; any run in progress was paused and can be continued.';
    document.body.prepend(bar);
  } else if (!off && bar) bar.remove();
}

async function api(path, body) {
  let res;
  try {
    res = await fetch(path, {
      method: body ? 'POST' : 'GET',
      headers: { 'x-orc-token': TOKEN, ...(body ? { 'content-type': 'application/json' } : {}) },
      body: body ? JSON.stringify(body) : undefined,
    });
  } catch (err) { setOffline(true); throw err; }
  if (res.status === 403) { setOffline(true); throw new Error('reload this page'); }
  setOffline(false);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'request failed');
  return data;
}

/* ---------- projects and runs (left) ---------- */

const STATUS = {
  running: ['Working', 'live'], paused: ['Paused', 'warn'], passed: ['Done', 'ok'],
  needs_human: ['Needs you', 'bad'], error: ['Stopped', 'warn'], failed: ['Failed', 'bad'], pending: ['Waiting', ''],
};
const chip = (status) => { const [text, cls] = STATUS[status] || [status, '']; return '<span class="chip ' + cls + '">' + esc(text) + '</span>'; };
const dot = (status) => '<span class="dot ' + ((STATUS[status] || [])[1] || '') + '"></span>';

function projectFolders(recent) {
  const saved = load('orc.projects', []);
  const all = [...saved, ...(recent || [])];
  const seen = new Set();
  return all.filter((f) => { const key = f.toLowerCase(); if (!f || seen.has(key)) return false; seen.add(key); return true; }).slice(0, 12);
}

async function loadProjects(recent) {
  const folders = projectFolders(recent || ui.recent || []);
  ui.projects = await Promise.all(folders.map(async (folder) => {
    try { const d = await api('/api/runs?folder=' + encodeURIComponent(folder)); return { folder, repo: d.repo, runs: d.runs }; }
    catch { return { folder, repo: null, runs: [] }; }
  }));
  renderProjects();
}

function renderProjects() {
  const q = ui.search.trim().toLowerCase();
  const html = ui.projects.map((p) => {
    const runs = p.runs.filter((r) => !q || r.request.toLowerCase().includes(q) || base(p.folder).toLowerCase().includes(q));
    if (q && !runs.length) return '';
    const cur = ui.folder && ui.folder.toLowerCase() === p.folder.toLowerCase();
    return '<div class="proj"><button class="proj-h' + (cur ? ' cur' : '') + '" data-project="' + esc(p.folder) + '" title="' + esc(p.folder) + '"><span class="name">' + esc(base(p.folder)) + '</span><span title="New run here">＋</span></button>' +
      (runs.length ? runs.map((r) =>
        '<button class="runbtn' + (ui.view.kind === 'run' && ui.view.id === r.id && ui.repo === p.repo ? ' sel' : '') + '" data-run="' + esc(r.id) + '" data-repo="' + esc(p.repo || '') + '" data-folder="' + esc(p.folder) + '" title="' + esc(r.request) + '">' +
        dot(r.status) + '<span class="t">' + esc(r.request) + '</span></button>').join('')
        : '<div class="empty">No runs yet</div>') + '</div>';
  }).join('');
  $('projects').innerHTML = html || '<div class="empty">' + (q ? 'Nothing matches.' : 'Add a project folder to begin.') + '</div>';
}

function setFolder(path, keepView) {
  ui.folder = String(path || '').trim();
  store('orc.folder', ui.folder);
  if (ui.folder) {
    const saved = load('orc.projects', []);
    if (!saved.some((f) => f.toLowerCase() === ui.folder.toLowerCase())) store('orc.projects', [ui.folder, ...saved].slice(0, 12));
    api('/api/project', { folder: ui.folder }).catch(() => {});
  }
  if (!keepView) { ui.view = { kind: 'new' }; ui.info = null; ui.events = []; ui.error = ''; }
  loadProjects();
  render();
}

async function openRun(id, repo, folder) {
  ui.view = { kind: 'run', id };
  if (repo) ui.repo = repo;
  if (folder) { ui.folder = folder; store('orc.folder', folder); }
  ui.events = []; ui.info = null; ui.error = ''; ui.loadError = ''; ui.open = new Set();
  renderProjects();
  render();
  await poll(true);
  scrollFeed(true);
  if (window.innerWidth <= 1100) $('app').classList.add('noleft');
}

/* ---------- live updates ---------- */

async function poll(force) {
  if (ui.view.kind !== 'run' || !ui.repo) return;
  const id = ui.view.id;
  let data;
  try {
    data = await api('/api/run?repo=' + encodeURIComponent(ui.repo) + '&id=' + encodeURIComponent(id) + '&from=' + ui.events.length);
  } catch (err) {
    if (!ui.info) { ui.loadError = err.message; render(); }
    return;
  }
  if (ui.view.kind !== 'run' || ui.view.id !== id) return;
  ui.loadError = '';
  const before = ui.info;
  const changed = force || data.events.length > 0 || !before || before.live !== data.live ||
    before.state.status !== data.state.status || Boolean(before.pending) !== Boolean(data.pending) ||
    JSON.stringify(before.options) !== JSON.stringify(data.options);
  if (data.events.length) { ui.events.push(...data.events); ui.lastEventAt = Date.now(); }
  ui.info = data;
  if (changed) { const near = nearBottom(); render(); if (near) scrollFeed(); if (before && before.state.status !== data.state.status) loadProjects(); }
}

setInterval(() => poll(false), 1000);
setInterval(() => { if (ui.info && ui.info.live) loadProjects(); }, 8000);
setInterval(() => {
  const el = $('elapsed');
  if (!el) return;
  const s = Math.round((Date.now() - ui.lastEventAt) / 1000);
  el.textContent = s < 5 ? '' : (s >= 60 ? Math.floor(s / 60) + 'm ' + (s % 60) + 's' : s + 's');
}, 1000);

const nearBottom = () => { const f = $('feed'); return f.scrollTop + f.clientHeight >= f.scrollHeight - 160; };
const scrollFeed = () => { const f = $('feed'); f.scrollTop = f.scrollHeight; };

/* ---------- the event log as a conversation ---------- */

function executorKind(state, options) {
  const model = (state.usage && state.usage.executor && state.usage.executor.model) || '';
  if (options && options.mode === 'open') return { name: 'Hydrogen', cls: 'hydro', letter: 'H' };
  if (/hydrogen/i.test(model) || (options && options.executorWorkers)) return { name: 'Hydrogen workers', cls: 'hydro', letter: 'H' };
  return { name: 'Argon', cls: 'argon', letter: 'A' };
}

function buildFeed(events) {
  const items = [];
  const tasks = new Map();
  let planning = { kind: 'planning', lines: [] };
  let sink = planning.lines;
  let task = null, attempt = null, lastQa = null, planItem = null;
  const m = { working: null, paused: null, outcome: null, files: [], plan: null };
  items.push(planning);
  const findAttempt = (label) => task && [...task.attempts].reverse().find((a) => a.label === label);
  for (const e of events) {
    switch (e.type) {
      case 'working': m.working = e; sink.push({ step: true, who: e.who, text: e.what }); break;
      case 'activity': sink.push({ who: e.who, text: e.text }); break;
      case 'questions':
        if (e.stage === 'plan approval') break;
        lastQa = { kind: 'qa', stage: e.stage, questions: e.questions, answers: null }; items.push(lastQa); break;
      case 'answers':
        if (e.stage === 'plan approval') { const r = (e.answers && e.answers[0] || '').trim(); items.push({ kind: 'user', text: r || 'Approved.' }); break; }
        if (lastQa) lastQa.answers = e.answers; break;
      case 'plan_ready': {
        const from = e.from || 0;
        if (planItem && planItem.from === from && !planItem.approved) Object.assign(planItem, { tasks: e.tasks, assumptions: e.assumptions || [] });
        else { planItem = { kind: 'plan', from, tasks: e.tasks, assumptions: e.assumptions || [] }; items.push(planItem); }
        m.plan = e.tasks;
        break;
      }
      case 'plan_approved': if (planItem) planItem.approved = true; break;
      case 'followup': items.push({ kind: 'user', text: e.request }); planning = { kind: 'planning', lines: [] }; items.push(planning); sink = planning.lines; break;
      case 'task_started':
        task = tasks.get(e.index);
        if (!task) { task = { kind: 'task', index: e.index, title: e.title, status: 'running', lines: [], wo: null, attempts: [] }; tasks.set(e.index, task); items.push(task); }
        task.status = 'running'; attempt = null; sink = task.lines; break;
      case 'work_order': if (task) task.wo = e; break;
      case 'attempt_started':
        m.working = { who: 'executor', what: 'building, attempt ' + e.attempt + ' of ' + e.max };
        if (task) { attempt = findAttempt('attempt ' + e.attempt) || { label: 'attempt ' + e.attempt, title: 'Attempt ' + e.attempt + ' of ' + e.max, lines: [] }; if (!task.attempts.includes(attempt)) task.attempts.push(attempt); sink = attempt.lines; }
        break;
      case 'workers_started': if (attempt) attempt.workers = e.workers; break;
      case 'escalation_started':
        m.working = { who: 'lead', what: 'taking over the task itself' };
        if (task) { attempt = { label: 'escalation', title: 'Opus takes over', lines: [], lead: true }; task.attempts.push(attempt); sink = attempt.lines; }
        break;
      case 'changes': { const a = findAttempt(e.label); if (a) { a.changes = e; sink = a.lines; } if (Array.isArray(e.files)) m.files = e.files; break; }
      case 'verify_done': { const a = findAttempt(e.label); if (a) a.verify = e; break; }
      case 'review_done': { const a = findAttempt(e.label); if (a) a.review = e; break; }
      case 'task_passed': if (task) { task.status = 'passed'; task.commit = e.commit; } break;
      case 'task_failed': if (task) { task.status = 'failed'; task.failed = e.summary; } break;
      case 'task_reset': { const t = tasks.get(e.index); if (t) { t.attempts = []; t.status = 'pending'; } items.push({ kind: 'sys', text: e.reason }); break; }
      case 'executor_ended_early': sink.push({ step: true, who: 'orc', text: 'the executor stopped before finishing: ' + e.reason }); break;
      case 'subagents_requested': sink.push({ step: true, who: 'executor', text: 'asked to use ' + e.subagents.length + ' sub-agent' + (e.subagents.length === 1 ? '' : 's') + ': ' + e.subagents.map((x) => x.role).join(', ') }); break;
      case 'subagents_decided': sink.push({ step: true, who: 'lead', text: e.approved ? 'approved ' + e.subagents.length + ' sub-agent' + (e.subagents.length === 1 ? '' : 's') + ': ' + e.subagents.map((x) => x.role).join(', ') + (e.note ? '. ' + e.note : '') : 'did not approve sub-agents; Hydrogen does it alone' + (e.note ? '. ' + e.note : '') }); break;
      case 'attempt_empty': sink.push({ step: true, who: 'orc', text: 'no files changed, so this did not count as an attempt (' + e.run + ' of ' + e.max + ')' }); break;
      case 'user_note': items.push({ kind: 'user', text: noteText(e.text) }); break;
      case 'paused': m.paused = e; m.working = null; items.push({ kind: 'sys', text: e.stopped ? 'You stopped the run.' : e.limit ? 'Paused: a usage limit was reached.' : 'Paused: ' + String(e.message || '').slice(0, 160) }); break;
      case 'round_started': items.push({ kind: 'sys', text: 'Task ' + (e.index + 1) + ': the workers get round ' + e.round + ' of ' + e.max + ' instead of Opus taking over' }); break;
      case 'resumed': m.paused = null; m.outcome = null; items.push({ kind: 'sys', text: 'Continued' }); break;
      case 'run_finished': m.working = null; break;
      case 'outcome': m.outcome = e; break;
    }
  }
  return { items, m };
}

const det = (key, summary, inner) =>
  '<details data-k="' + esc(key) + '"' + (ui.open.has(key) ? ' open' : '') + '><summary>' + summary + '</summary><div>' + inner + '</div></details>';

function linesHtml(lines, key) {
  if (!lines.length) return '';
  const one = (l) => '<li>' + (l.step ? '<b>' + esc(l.who === 'executor' ? 'workers' : l.who === 'lead' ? 'opus' : l.who) + ':</b> ' : '') + esc(l.text) + '</li>';
  return det(key + '-lines', plural(lines.length, 'step'), '<ul class="lines">' + lines.map(one).join('') + '</ul>');
}

function header(kind) {
  if (kind === 'claude') return '<div class="who"><span class="av claude">O</span>Opus</div>';
  if (kind === 'orc') return '<div class="who"><span class="av orc">o</span>orc</div>';
  return '<div class="who"><span class="av ' + kind.cls + '">' + kind.letter + '</span>' + esc(kind.name) + '</div>';
}

function attemptHtml(a, key, ex) {
  let h = '<div class="att"><h4>' + (a.lead ? '<span class="av claude" style="width:18px;height:18px;font-size:10px">O</span>' : '<span class="av ' + ex.cls + '" style="width:18px;height:18px;font-size:10px">' + ex.letter + '</span>') + esc(a.title);
  if (a.review) h += a.review.verdict === 'pass' ? '<span class="chip ok">Passed review</span>' : '<span class="chip bad">Sent back</span>';
  h += '</h4>';
  if (a.workers && a.workers.length) h += '<p class="hint" style="margin:0 0 4px">' + esc(a.workers.join(' · ')) + '</p>';
  if (a.changes && Array.isArray(a.changes.files)) {
    const f = a.changes.files;
    h += det(key + '-files', plural(f.length, 'file') + ' changed', '<ul class="filelist">' + f.map((x) => '<li>' + esc(x) + '</li>').join('') + '</ul>' + (a.changes.report ? '<p class="hint">Report:</p><div class="quote">' + esc(a.changes.report) + '</div>' : ''));
  }
  if (a.verify) {
    const v = a.verify;
    h += '<p class="kv">Checks: ' + (v.ran === 0 ? '<span class="hint">none set</span>' : v.failed.length ? '<span class="chip bad">failed</span> <code>' + esc(v.failed.join('; ')) + '</code>' : '<span class="chip ok">' + plural(v.ran, 'check') + ' passed</span>') + '</p>';
  }
  if (a.review) {
    const r = a.review;
    h += '<p class="kv"><b>Opus:</b> ' + esc(r.summary) + '</p>';
    if (r.verdict !== 'pass' && Array.isArray(r.issues) && r.issues.length) h += '<ol>' + r.issues.map((it) => '<li>' + (it.file ? '<code>' + esc(it.file) + '</code> ' : '') + esc(it.problem) + '</li>').join('') + '</ol>';
    if (r.nextInstruction) h += det(key + '-next', 'New instructions for the next attempt', '<div class="quote">' + esc(r.nextInstruction) + '</div>');
  }
  return h + linesHtml(a.lines, key) + '</div>';
}

function taskHtml(t, ex) {
  const key = 't' + t.index;
  let h = '<div class="msg"><div class="task"><div class="task-h"><h3>' + (t.index + 1) + '. ' + esc(t.title) + '</h3>' + chip(t.status) + '</div>';
  const wo = t.wo;
  if (wo && Array.isArray(wo.steps)) {
    h += header('claude') + '<div class="ai"><p>' + esc(wo.goal) + '</p>' +
      det(key + '-wo', 'Instructions (' + plural(wo.steps.length, 'step') + ')', '<ol>' + wo.steps.map((s) => '<li>' + esc(s) + '</li>').join('') + '</ol>') +
      det(key + '-crit', 'What it must meet to pass (' + wo.criteria.length + ')', '<ul>' + wo.criteria.map((c) => '<li>' + esc(c) + '</li>').join('') + '</ul>') + '</div>';
  }
  h += linesHtml(t.lines, key + '-o');
  h += t.attempts.map((a, i) => attemptHtml(a, key + '-a' + i, ex)).join('');
  if (t.status === 'passed' && t.commit) h += '<p class="hint">Saved as <code>' + esc(String(t.commit).slice(0, 7)) + '</code></p>';
  if (t.status === 'failed') h += '<p class="err">Still failing: ' + esc(t.failed) + '</p>';
  return h + '</div></div>';
}

function itemHtml(it, ex, state) {
  switch (it.kind) {
    case 'user': return '<div class="msg user"><div class="b">' + esc(it.text) + (it.files ? '<div class="files">' + esc(it.files) + '</div>' : '') + '</div></div>';
    case 'sys': return '<p class="sys">' + esc(it.text) + '</p>';
    case 'planning': return it.lines.length ? '<div class="msg">' + header('claude') + linesHtml(it.lines, 'plan-' + items_index(it)) + '</div>' : '';
    case 'qa': return '<div class="msg">' + header('claude') + '<div class="ai"><p>' + (it.answers ? 'I asked:' : 'Before I go on, I need to know:') + '</p><ol>' +
      it.questions.map((q, i) => '<li>' + esc(q) + (it.answers ? '<div class="quote" style="margin-top:4px">' + (esc(it.answers[i]) || '<em>left to me</em>') + '</div>' : '') + '</li>').join('') + '</ol></div></div>';
    case 'plan': {
      const tasks = it.tasks.slice(it.from);
      return '<div class="msg">' + header('claude') + '<div class="ai"><p>' + (it.from ? 'Here is the plan for your new request:' : 'Here is the plan:') + '</p><ol start="' + (it.from + 1) + '">' +
        tasks.map((t) => '<li>' + esc(t) + '</li>').join('') + '</ol>' +
        (it.assumptions.length ? det('assume-' + it.from, 'What I decided on my own (' + it.assumptions.length + ')', '<ul>' + it.assumptions.map((a) => '<li>' + esc(a) + '</li>').join('') + '</ul>') : '') + '</div></div>';
    }
    case 'task': return taskHtml(it, ex);
  }
  return '';
}
let feedItems = [];
const items_index = (it) => feedItems.indexOf(it);

/** Shows a message without the full file paths the lead needs. */
function noteText(text) {
  const [body, files] = String(text).split('\n\nATTACHED FILES');
  if (!files) return body;
  const names = (files.match(/^- .+$/gm) || []).map((l) => l.slice(2).split(/[\\/]/).pop().replace(/^(msg|req)\d+-/, ''));
  return body + (names.length ? '\n📎 ' + names.join(', ') : '');
}

/* ---------- rendering ---------- */

function render() {
  renderCenter();
  renderRight();
  renderComposer();
}

function renderCenter() {
  const main = $('main');
  if (ui.view.kind !== 'run') {
    $('bartitle').textContent = 'New run';
    $('barchip').innerHTML = ''; $('barstop').innerHTML = '';
    main.innerHTML = '<div class="hello"><h1>What do you want built?</h1><p class="hint">' +
      (ui.folder ? 'In <span class="mono">' + esc(ui.folder) + '</span>. Opus plans and reviews; the workers write the code. Your folder only changes when the work passes.' : 'Add or pick a project folder on the left first.') +
      '</p></div>' + (ui.error ? '<p class="err" style="text-align:center">' + esc(ui.error) + '</p>' : '');
    return;
  }
  const info = ui.info;
  if (!info) { main.innerHTML = ui.loadError ? '<p class="err">' + esc(ui.loadError) + '</p>' : '<p class="sys">Loading…</p>'; return; }
  const state = info.state;
  const ex = executorKind(state, info.options);
  const { items, m } = buildFeed(ui.events);
  feedItems = items;
  ui.model = m;

  $('bartitle').textContent = state.request;
  $('barchip').innerHTML = chip(state.status);
  $('barstop').innerHTML = (info.live || state.status === 'running') ? '<button id="stop" class="small danger">Stop</button>' : '';

  const files = (state.attachments || []).length ? '📎 ' + state.attachments.map((x) => base(x).replace(/^req\d+-/, '')).join(', ') : '';
  let h = '<div class="msg user"><div class="b">' + esc(state.request) + (files ? '<div class="files">' + esc(files) + '</div>' : '') + '</div></div>';
  h += items.map((it) => itemHtml(it, ex, state)).join('');

  if (!info.live && state.status === 'running') h += '<div class="banner info">Another orc window is running this. Messages and settings reach it from here; the lead\'s questions appear in that window.</div>';

  if (info.pending && info.pending.stage === 'plan approval') {
    h += '<div class="card ask"><strong>Check the plan.</strong><div class="quote" style="margin-top:8px">' + esc(info.pending.questions[0]) + '</div>' +
      '<p class="hint">Approve it, or type what to change in the box below and send.</p><div class="row" style="margin-top:10px"><button id="approveplan" class="primary">Approve and start</button></div></div>';
  } else if (info.pending) {
    h += '<div class="card ask"><strong>Opus needs your answer</strong><p class="hint" style="margin:2px 0 0">Leave a box empty to let Opus decide that one.</p><ol>' +
      info.pending.questions.map((q, i) => '<li><p>' + esc(q) + '</p><textarea data-answer="' + i + '" rows="2" aria-label="Answer ' + (i + 1) + '"></textarea></li>').join('') +
      '</ol><div class="row" style="margin-top:12px"><button id="answer" class="primary">Send answers</button></div></div>';
  } else if (info.live && m.working) {
    const lastAct = [...ui.events].reverse().find((e) => e.type === 'activity');
    const who = m.working.who === 'lead' ? 'Opus' : ex.name;
    h += '<div class="now"><div class="spinner" aria-hidden="true"></div><div class="what"><strong>' + esc(who) + ': ' + esc(m.working.what) + '</strong><small>' + (lastAct ? esc(lastAct.text) : '') + '</small></div><small id="elapsed"></small></div>';
  }

  if (!info.live && state.status === 'paused') {
    const p = m.paused;
    const reset = p && typeof p.resetsAt === 'number' && p.resetsAt * 1000 > Date.now() ? " Claude's limit resets around " + new Date(p.resetsAt * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + '.' : '';
    const why = !p ? 'It was interrupted.' : p.stopped ? 'You stopped it.' : p.limit ? 'A usage limit was reached.' + reset : 'It stopped on an error.';
    h += '<div class="banner warn"><strong>Paused. ' + esc(why) + '</strong>Everything finished is saved. Send a message to give Opus instructions, then use Continue.' +
      (p && !p.stopped && p.message ? '<div class="quote" style="margin-top:8px">' + esc(p.message) + '</div>' : '') + '</div>';
  }
  if (!info.live && state.status === 'needs_human') {
    const failed = (state.tasks || []).filter((t) => t.status === 'failed');
    const suggested = failed.flatMap((t) => (t.workOrder && t.workOrder.verify_commands) || []);
    h += '<div class="card ask"><strong>Retry ' + (failed.length === 1 ? 'step: ' + esc(failed[0].title) : 'the failed step') + '</strong>' +
      '<p class="hint" style="margin:2px 0 8px">The step keeps everything written so far and gets a fresh set of attempts. Send any instructions in the box below first.</p>' +
      '<label for="retrychecks">Checks orc runs before each review, one per line. They run on this computer, in the run\'s copy of the project. Clear the box to run none.</label>' +
      '<textarea id="retrychecks" rows="' + Math.min(10, Math.max(2, suggested.length)) + '" class="mono">' + esc(suggested.join('\n')) + '</textarea>' +
      '<div class="row" style="margin-top:10px"><button id="retry" class="primary"' + (ui.busy ? ' disabled' : '') + '>Retry this step</button></div></div>';
  }
  if (m.outcome && state.status !== 'paused' && !info.live) {
    const o = m.outcome;
    if (o.outcome === 'applied') h += '<div class="banner ok"><strong>Done. The finished work is in your folder.</strong>Ask for more in the box below. Opus plans it as new tasks and remembers this project.</div>';
    else if (o.outcome === 'conflict') h += '<div class="banner warn"><strong>It passed, but the folder changed while it ran.</strong>The work is safe on branch <code>' + esc(o.branch) + '</code>.</div>';
    else if (o.outcome === 'on_branch') h += '<div class="banner ok"><strong>Done. The work is on branch <code>' + esc(o.branch) + '</code>.</strong>Merging it is left to you.</div>';
  }
  if (ui.error) h += '<p class="err">' + esc(ui.error) + '</p>';

  const keyOf = (t) => t.id || 'answer-' + t.dataset.answer;
  const drafts = new Map([...main.querySelectorAll('textarea')].map((t) => [keyOf(t), t.value]));
  const focused = document.activeElement && document.activeElement.tagName === 'TEXTAREA' && main.contains(document.activeElement) ? keyOf(document.activeElement) : null;
  main.innerHTML = h;
  for (const t of main.querySelectorAll('textarea')) {
    const key = keyOf(t);
    if (drafts.has(key)) t.value = drafts.get(key);
    if (key === focused) t.focus();
  }
}

/* ---------- right: context and usage ---------- */

const LEAD_MODELS = [['opus', 'Claude Opus'], ['claude-fable-5-2', 'Claude Fable 5.2'], ['sonnet', 'Claude Sonnet']];
const EFFORTS = [['', 'Default'], ['low', 'Low'], ['medium', 'Medium'], ['high', 'High'], ['xhigh', 'Extra high'], ['max', 'Max']];
const WORKERS = [['', 'Argon writes it'], ['gemini-4-hydrogen-low', 'Hydrogen workers, Low'], ['gemini-4-hydrogen-medium', 'Hydrogen workers, Medium'], ['gemini-4-hydrogen-high', 'Hydrogen workers, High'], ['gemini-4-hydrogen-xhigh', 'Hydrogen workers, XHigh']];
const MODES = [['closed', 'Closed loop: Opus reviews every task'], ['open', 'Open-ended: Hydrogen builds it, you review']];
const MODE_HINT = 'Closed loop: for hard work. Opus checks every task and sends it back until it passes. Open-ended: Opus only writes the instructions; one Hydrogen session does every task (the Hydrogen level below, High if Argon is picked) and nothing is reviewed before you see it.';
const MINUTES = [['20', '20 minutes'], ['30', '30 minutes'], ['45', '45 minutes'], ['60', '1 hour'], ['90', '1½ hours'], ['120', '2 hours'], ['180', '3 hours']];
const optionTags = (list, current) =>
  (list.some((m) => m[0] === current) ? list : [[current, current], ...list])
    .map((m) => '<option value="' + esc(m[0]) + '"' + (m[0] === current ? ' selected' : '') + '>' + esc(m[1]) + '</option>').join('');

function meter(label, v) {
  if (typeof v !== 'number') return '';
  const pct = Math.min(100, Math.round(v * 100));
  return '<div class="meter' + (v >= 0.85 ? ' high' : '') + '"><div class="top"><span>' + label + '</span><span>' + pct + '%</span></div><div class="barx"><i style="width:' + pct + '%"></i></div></div>';
}

function modelBlock(name, cls, letter, rows, note) {
  const total = rows.reduce((n, r) => n + r.inp + r.out + r.cache, 0);
  if (!total) return '<div class="model"><div class="model-h"><span class="av ' + cls + '" style="width:18px;height:18px;font-size:10px">' + letter + '</span>' + esc(name) + '<span class="sub">not used</span></div>' + (note ? '<p class="hint">' + note + '</p>' : '') + '</div>';
  const fresh = rows.reduce((n, r) => n + r.inp + r.out, 0);
  const cached = rows.reduce((n, r) => n + r.cache, 0);
  return '<div class="model"><div class="model-h"><span class="av ' + cls + '" style="width:18px;height:18px;font-size:10px">' + letter + '</span>' + esc(name) + '<span class="sub">' + k(total) + '</span></div>' +
    '<div class="seg"><i style="width:' + (fresh / total * 100) + '%;background:var(--c-' + cls + ')"></i><i style="width:' + (cached / total * 100) + '%;background:var(--c-' + cls + ');opacity:.35"></i></div>' +
    '<table class="u">' + rows.filter((r) => r.calls).map((r) => '<tr><td>' + esc(r.label) + ' · ' + plural(r.calls, 'call') + '</td><td>' + k(r.inp + r.out) + ' new · ' + k(r.cache) + ' cached</td></tr>').join('') + '</table>' +
    (note ? '<p class="hint">' + note + '</p>' : '') + '</div>';

function renderRight() {
  const r = $('right');
  const info = ui.view.kind === 'run' ? ui.info : null;
  let h = '<div class="rsec"><h2>Environment</h2>' +
    '<div class="env"><span class="ic">▢</span><span>' + (ui.folder ? esc(base(ui.folder)) + ' · <span class="hint" style="margin:0">' + esc(ui.folder) + '</span>' : '<span class="hint" style="margin:0">No project chosen</span>') + '</span></div>' +
    (info ? '<div class="env"><span class="ic">⑂</span><span class="mono">' + esc(info.state.branch) + '</span></div>' : '') + '</div>';

  if (!info) {
    h += '<div class="rsec"><h2>New run settings</h2><div class="opts">' +
      '<div><label for="runmode">Mode</label><select id="runmode">' + optionTags(MODES, load('orc.mode', 'closed')) + '</select><p class="hint">' + MODE_HINT + '</p></div>' +
      '<div><label for="lead">Lead (plans and reviews)</label><select id="lead">' + optionTags(LEAD_MODELS, load('orc.lead', 'opus')) + '</select></div>' +
      '<div><label for="effort">Lead thinking level</label><select id="effort">' + optionTags(EFFORTS, load('orc.effort', '')) + '</select></div>' +
      '<div><label for="workers">Who writes the code</label><select id="workers">' + optionTags(WORKERS, load('orc.workers', '')) + '</select></div>' +
      '<div><label for="minutes">Time limit per attempt</label><select id="minutes">' + optionTags(MINUTES, load('orc.minutes', '45')) + '</select></div>' +
      '<div><label for="attempts">Attempts before Opus takes over</label><select id="attempts">' + ['1', '2', '3', '4', '5'].map((n) => '<option' + (n === load('orc.attempts', '3') ? ' selected' : '') + '>' + n + '</option>').join('') + '</select></div>' +
      '<label class="check"><input type="checkbox" id="confirmplan"' + (load('orc.confirmplan', true) ? ' checked' : '') + '><span>Let me check the plan before work starts</span></label>' +
      '<label class="check"><input type="checkbox" id="allowcmds"' + (load('orc.allowcmds', false) ? ' checked' : '') + '><span>Let Argon run commands (installs, builds, tests) without asking</span></label>' +
      '<label class="check"><input type="checkbox" id="takeover"' + (load('orc.takeover', true) ? ' checked' : '') + '><span>Let Opus take over after the attempts (off: the workers get another round instead, saving Claude usage)</span></label>' +
      '<div><label for="verify">Checks, one per line (a failed check always sends the work back; format checks are fixed automatically)</label><textarea id="verify" rows="3" class="mono" placeholder="npm test">' + esc(load('orc.verify', '')) + '</textarea></div>' +
      '</div></div>';
    r.innerHTML = h;
    return;
  }

  const state = info.state;
  const u = state.usage || {};
  const row = (role, label) => { const x = u[role] || {}; return { label, calls: x.calls || 0, inp: x.inputTokens || 0, out: x.outputTokens || 0, cache: x.cachedTokens || 0 }; };
  const lim = state.planLimits || {};
  const ex = executorKind(state, info.options);
  const exRow = [row('executor', ex.name === 'Argon' ? 'Writing code' : 'Workers')];
  const empty = [{ label: '', calls: 0, inp: 0, out: 0, cache: 0 }];
  const agyNote = ui.model && ui.model.paused && /quota|usage limit/i.test(ui.model.paused.message || '') && /agy|executor/i.test(ui.model.paused.message || '')
    ? '<span style="color:var(--bad)">agy reported its quota is used up.</span>' : 'agy does not report how much quota is left.';
  h += '<div class="rsec"><h2>Usage</h2>' +
    modelBlock('Claude · ' + ((u.architect && u.architect.model) || info.options && info.options.leadModel || 'lead'), 'claude', 'O',
      [row('architect', 'Planning'), row('reviewer', 'Reviews'), row('escalation', 'Takeovers')], '') +
    meter('Claude 5-hour limit', lim.fiveHour) + meter('Claude weekly limit', lim.sevenDay) +
    '<div style="height:10px"></div>' +
    (ex.name === 'Argon'
      ? modelBlock('Argon (Gemini)', 'argon', 'A', exRow, agyNote) + modelBlock('Hydrogen workers', 'hydro', 'H', empty, '')
      : modelBlock('Argon (Gemini)', 'argon', 'A', empty, '') + modelBlock('Hydrogen workers (Gemini)', 'hydro', 'H', exRow, agyNote)) +
    '<p class="hint">New tokens count fully against limits; cached ones (the same conversation sent again) count much less.</p></div>';

  const o = info.options;
  const canChange = o && (info.live || ['paused', 'running', 'needs_human', 'passed'].includes(state.status));
  if (o) {
    h += '<div class="rsec"><h2>Run settings</h2>' + (canChange ? '<div class="opts">' +
      '<div><label for="modeswitch">Mode</label><select id="modeswitch">' + optionTags(MODES, o.mode || 'closed') + '</select></div>' +
      '<div><label for="leadswitch">Lead</label><select id="leadswitch">' + optionTags(LEAD_MODELS, o.leadModel) + '</select></div>' +
      '<div><label for="effortswitch">Thinking level</label><select id="effortswitch">' + optionTags(EFFORTS, o.leadEffort) + '</select></div>' +
      '<div><label for="workersswitch">Who writes the code</label><select id="workersswitch">' + optionTags(WORKERS, o.executorWorkers || '') + '</select></div>' +
      '<div><label for="minutesswitch">Time limit per attempt</label><select id="minutesswitch">' + optionTags(MINUTES, String(o.executorMinutes || 45)) + '</select></div>' +
      '<label class="check"><input type="checkbox" id="cmdswitch"' + (o.executorSkipPermissions ? ' checked' : '') + '><span>Let Argon run commands</span></label>' +
      '<label class="check"><input type="checkbox" id="takeoverswitch"' + (o.takeover !== false ? ' checked' : '') + '><span>Let Opus take over after the attempts (off: the workers get another round instead)</span></label>' +
      '</div><p class="hint">' + (info.live ? "Applies from each model's next step." : 'Used the next time this run works.') + '</p>' : '<p class="hint">Lead: ' + esc(o.leadModel) + '</p>') + '</div>';
  }

  const tasks = state.tasks || [];
  if (tasks.length) {
    h += '<div class="rsec"><h2>Tasks · ' + tasks.filter((t) => t.status === 'passed').length + ' of ' + tasks.length + ' done</h2><ul class="tasks">' +
      tasks.map((t, i) => '<li>' + dot(t.status) + '<span class="t" title="' + esc(t.title) + '">' + (i + 1) + '. ' + esc(t.title) + '</span></li>').join('') + '</ul></div>';
  }
  const files = (ui.model && ui.model.files) || [];
  if (files.length) {
    h += '<div class="rsec"><h2>Latest changes · ' + plural(files.length, 'file') + '</h2><ul class="filelist">' +
      files.slice(0, 30).map((f) => '<li title="' + esc(f) + '">' + esc(f) + '</li>').join('') + (files.length > 30 ? '<li class="hint">… and ' + (files.length - 30) + ' more</li>' : '') + '</ul></div>';
  }
  const scroll = r.scrollTop;
  r.innerHTML = h;
  r.scrollTop = scroll;
}

/* ---------- composer ---------- */

function composerMode() {
  if (ui.view.kind !== 'run') return { kind: 'start', hint: ui.folder ? 'New run in ' + base(ui.folder) : 'Choose a project first', ph: 'Describe what you want built' };
  const info = ui.info;
  if (!info) return { kind: 'none', hint: '', ph: '' };
  const s = info.state.status;
  if (info.pending && info.pending.stage === 'plan approval') return { kind: 'note', hint: 'Your reply asks Opus to change the plan', ph: 'What should change in the plan?' };
  if (info.pending) return { kind: 'note', hint: 'This message answers Opus\'s questions', ph: 'Answer Opus' };
  if (info.live || s === 'running') return { kind: 'note', hint: 'Reaches Opus at its next step', ph: 'Message Opus' };
  if (s === 'paused' || s === 'error') return { kind: 'note', hint: 'Reaches Opus when you continue', ph: 'Message Opus', extra: '<button id="resume" class="small primary"' + (ui.busy ? ' disabled' : '') + '>Continue</button>' };
  if (s === 'needs_human') return { kind: 'note', hint: 'Reaches Opus when you retry the step', ph: 'Message Opus' };
  if (s === 'passed') return { kind: 'followup', hint: 'A new request: Opus plans it as new tasks in this project', ph: 'Ask for more, for example: make it deployable on Vercel' };
  return { kind: 'none', hint: 'This run has ended', ph: '' };
}

function renderComposer() {
  const mode = composerMode();
  $('mode').textContent = mode.hint;
  $('msg').placeholder = mode.ph;
  $('msg').disabled = mode.kind === 'none';
  $('extra').innerHTML = mode.extra || '';
  $('send').disabled = mode.kind === 'none' || ui.busy || (mode.kind === 'start' && !ui.folder);
}

function autosize() { const t = $('msg'); t.style.height = 'auto'; t.style.height = Math.min(260, t.scrollHeight) + 'px'; }

async function send() {
  const mode = composerMode();
  const text = $('msg').value.trim();
  if (!text && !ui.files.msg.length) return;
  ui.busy = true; ui.error = ''; renderComposer();
  try {
    const files = await encodeFiles('msg');
    if (mode.kind === 'start') {
      saveNewRunSettings();
      const body = { folder: ui.folder, request: text, files, verify: $('verify').value, leadModel: $('lead').value, leadEffort: $('effort').value,
        allowCommands: $('allowcmds').checked, takeover: $('takeover').checked, confirmPlan: $('confirmplan').checked, executorMinutes: Number($('minutes').value), executorWorkers: $('workers').value, mode: $('runmode').value, maxAttempts: $('attempts').value };
      const run = await api('/api/start', body);
      clearMsg();
      ui.busy = false;
      await loadProjects();
      await openRun(run.runId, run.repo, ui.folder);
      return;
    }
    if (mode.kind === 'followup') { await api('/api/followup', { repo: ui.repo, id: ui.view.id, text, files }); ui.events = []; }
    else await api('/api/note', { repo: ui.repo, id: ui.view.id, text, files });
    clearMsg();
  } catch (err) { ui.error = err.message; }
  ui.busy = false;
  await poll(true);
  scrollFeed();
  if (mode.kind === 'start') render();
}

function clearMsg() { $('msg').value = ''; autosize(); clearFiles('msg'); }

function saveNewRunSettings() {
  for (const [id, key] of [['runmode', 'orc.mode'], ['lead', 'orc.lead'], ['effort', 'orc.effort'], ['workers', 'orc.workers'], ['minutes', 'orc.minutes'], ['attempts', 'orc.attempts'], ['verify', 'orc.verify']]) store(key, $(id).value);
  store('orc.confirmplan', $('confirmplan').checked);
  store('orc.allowcmds', $('allowcmds').checked);
  store('orc.takeover', $('takeover').checked);
}

/* ---------- attachments ---------- */

const MAX_FILE = 20 * 1024 * 1024, MAX_TOTAL = 50 * 1024 * 1024;
const sizeText = (n) => (n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB');

function refreshChips(kind) {
  $('chips-' + kind).innerHTML = ui.files[kind].map((f, i) =>
    '<span class="chip-file" title="' + esc(f.file.name) + ' (' + sizeText(f.file.size) + ')">' + (f.preview ? '<img src="' + f.preview + '" alt="">' : '') +
    '<span>' + esc(f.file.name) + '</span><button data-unattach="' + kind + ':' + i + '" aria-label="Remove ' + esc(f.file.name) + '">×</button></span>').join('');
}

function addFiles(kind, fileList) {
  const list = ui.files[kind];
  for (const file of fileList) {
    if (!file || !file.size) continue;
    if (file.size > MAX_FILE) { alert(file.name + ' is larger than 20 MB.'); continue; }
    if (list.reduce((n, f) => n + f.file.size, 0) + file.size > MAX_TOTAL) { alert('Attachments are limited to 50 MB in total.'); break; }
    const name = file.name && file.name !== 'image.png' ? file.name : 'pasted-' + new Date().toISOString().replace(/\D/g, '').slice(8, 14) + '.png';
    const named = file.name === name ? file : new File([file], name, { type: file.type });
    list.push({ file: named, preview: /^image\//.test(file.type) ? URL.createObjectURL(file) : '' });
  }
  refreshChips(kind);
}

function clearFiles(kind) {
  for (const f of ui.files[kind]) if (f.preview) URL.revokeObjectURL(f.preview);
  ui.files[kind] = [];
  refreshChips(kind);
}

function encodeFiles(kind) {
  return Promise.all(ui.files[kind].map((f) => new Promise((done, fail) => {
    const reader = new FileReader();
    reader.onload = () => done({ name: f.file.name, data: String(reader.result).split(',')[1] || '' });
    reader.onerror = () => fail(new Error('could not read ' + f.file.name));
    reader.readAsDataURL(f.file);
  })));
}

document.addEventListener('change', (ev) => {
  const kind = ev.target.dataset && ev.target.dataset.attach;
  if (kind) { addFiles(kind, ev.target.files); ev.target.value = ''; }
});
$('msg').addEventListener('paste', (ev) => {
  if (!ev.clipboardData || !ev.clipboardData.files.length) return;
  ev.preventDefault();
  addFiles('msg', ev.clipboardData.files);
});
$('msg').addEventListener('input', autosize);
$('msg').addEventListener('keydown', (ev) => { if (ev.key === 'Enter' && !ev.shiftKey && !ev.isComposing) { ev.preventDefault(); send(); } });
const comp = $('composer');
document.addEventListener('dragover', (ev) => { if (ev.dataTransfer && [...ev.dataTransfer.types].includes('Files')) { ev.preventDefault(); comp.classList.add('dragging'); } });
document.addEventListener('dragleave', (ev) => { if (!ev.relatedTarget) comp.classList.remove('dragging'); });
document.addEventListener('drop', (ev) => { if (!ev.dataTransfer || !ev.dataTransfer.files.length) return; ev.preventDefault(); comp.classList.remove('dragging'); addFiles('msg', ev.dataTransfer.files); });

/* ---------- actions ---------- */

async function act(path, extra) {
  ui.error = '';
  try { await api(path, { repo: ui.repo, id: ui.view.id, ...(extra || {}) }); }
  catch (err) { ui.error = err.message; }
  await poll(true);
}

document.addEventListener('click', async (ev) => {
  const el = ev.target.closest('button');
  if (!el) return;
  if (el.dataset.unattach) {
    const [kind, i] = el.dataset.unattach.split(':');
    const [gone] = ui.files[kind].splice(Number(i), 1);
    if (gone && gone.preview) URL.revokeObjectURL(gone.preview);
    return refreshChips(kind);
  }
  if (el.dataset.run) return openRun(el.dataset.run, el.dataset.repo, el.dataset.folder);
  if (el.dataset.project) return setFolder(el.dataset.project);
  if (el.dataset.dir !== undefined) return browseTo(el.dataset.dir);
  switch (el.id) {
    case 'newrun': ui.view = { kind: 'new' }; ui.info = null; ui.error = ''; renderProjects(); render(); $('msg').focus(); break;
    case 'send': send(); break;
    case 'stop': el.disabled = true; act('/api/stop'); break;
    case 'resume': {
      el.disabled = true; ui.events = [];
      try { await api('/api/resume', { repo: ui.repo, id: ui.view.id }); ui.error = ''; } catch (err) { ui.error = err.message; }
      await poll(true); loadProjects(); break;
    }
    case 'retry': {
      el.disabled = true;
      try { await api('/api/retry', { repo: ui.repo, id: ui.view.id, checks: $('retrychecks').value }); ui.error = ''; ui.events = []; } catch (err) { ui.error = err.message; }
      await poll(true); loadProjects(); break;
    }
    case 'approveplan': el.disabled = true; act('/api/answer', { answers: [''] }); break;
    case 'answer': {
      const answers = [...document.querySelectorAll('[data-answer]')].map((t) => t.value.trim());
      el.disabled = true; act('/api/answer', { answers }); break;
    }
    case 'hideleft': $('app').classList.add('noleft'); break;
    case 'showleft': $('app').classList.toggle('noleft'); break;
    case 'toggleright': $('app').classList.toggle('noright'); store('orc.noright', $('app').classList.contains('noright')); break;
    case 'addproject': browseTo(ui.folder || ''); $('picker').showModal(); break;
    case 'pickcancel': $('picker').close(); break;
    case 'pickup': if (picker.parent !== null) browseTo(picker.parent); break;
    case 'pickuse': if (picker.path) { $('picker').close(); setFolder(picker.path); } break;
  }
});

document.addEventListener('toggle', (ev) => {
  const key = ev.target.dataset && ev.target.dataset.k;
  if (!key) return;
  if (ev.target.open) ui.open.add(key); else ui.open.delete(key);
}, true);

document.addEventListener('change', async (ev) => {
  const field = { leadswitch: 'leadModel', effortswitch: 'leadEffort', cmdswitch: 'executorSkipPermissions', takeoverswitch: 'takeover', minutesswitch: 'executorMinutes', workersswitch: 'executorWorkers', modeswitch: 'mode' }[ev.target.id];
  if (!field) return;
  const value = ev.target.type === 'checkbox' ? ev.target.checked : field === 'executorMinutes' ? Number(ev.target.value) : ev.target.value;
  ui.error = '';
  try { await api('/api/options', { repo: ui.repo, id: ui.view.id, [field]: value }); }
  catch (err) { ui.error = err.message; }
  await poll(true);
});

$('search').addEventListener('input', () => { ui.search = $('search').value; renderProjects(); });

/* ---------- folder picker ---------- */

const picker = { path: '', parent: null };
async function browseTo(path) {
  let data;
  try { data = await api('/api/dirs?path=' + encodeURIComponent(path)); }
  catch { data = await api('/api/dirs?path='); }
  picker.path = data.path; picker.parent = data.parent;
  $('pickpath').textContent = data.path || 'This computer';
  $('pickup').disabled = data.parent === null;
  $('pickuse').disabled = !data.path;
  $('pickdirs').innerHTML = data.dirs.length
    ? data.dirs.map((d) => '<li><button data-dir="' + esc(data.path ? data.path.replace(/[\\/]$/, '') + (data.path.includes('\\') ? '\\' : '/') + d : d) + '">' + esc(d) + '</button></li>').join('')
    : '<li class="empty" style="padding:10px">No folders inside this one.</li>';
}

/* ---------- start-up ---------- */

(async () => {
  if (load('orc.noright', false)) $('app').classList.add('noright');
  if (window.innerWidth <= 1100) $('app').classList.add('noleft', 'noright');
  let home = { recent: [] };
  try { home = await api('/api/home'); } catch {}
  ui.recent = home.recent;
  ui.folder = load('orc.folder', '') || home.recent[0] || '';
  await loadProjects(home.recent);
  render();
})();
</script>
</body>
